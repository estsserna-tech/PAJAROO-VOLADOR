<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- viewport para celular: escala 1:1, sin zoom del usuario -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- PWA / pantalla completa en iOS y Android -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Pájaro Volador</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #1a1a2e;
      overflow: hidden;
      font-family: Arial, sans-serif;
      /* Evita selección de texto al tocar rápido */
      user-select: none;
      -webkit-user-select: none;
      /* Evita el resaltado azul al tocar en Android */
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #gameContainer {
      position: relative;
      /* El tamaño se calcula en JS según la pantalla */
    }

    canvas {
      display: block;
      position: absolute;
      top: 0; left: 0;
      /* Suaviza el escalado en pantallas de alta densidad */
      image-rendering: auto;
    }

    /* ── Overlay Game Over ── */
    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.62);
      z-index: 10;
    }
    #overlay.visible { display: flex; }

    #overlay h1 {
      color: #ff4444;
      font-weight: 900;
      text-shadow: 3px 3px 0 #000;
      margin-bottom: 8px;
      /* Tamaño relativo al contenedor, se ajusta con JS */
      font-size: clamp(28px, 10vw, 56px);
    }
    #overlay .puntos {
      color: #fff;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: 28px;
      font-size: clamp(16px, 5vw, 28px);
    }
    #btnReiniciar {
      background: linear-gradient(135deg, #f7971e, #ffd200);
      color: #222;
      border: none;
      border-radius: 14px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 0 #b8860b;
      /* Tamaño mínimo táctil recomendado: 48×48 px */
      min-width: 160px;
      min-height: 54px;
      font-size: clamp(16px, 5vw, 22px);
      padding: 14px 40px;
      transition: transform .1s, box-shadow .1s;
      touch-action: manipulation;
    }
    #btnReiniciar:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #b8860b;
    }

    /* ── Pantalla de inicio ── */
    #startMsg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.45);
      z-index: 10;
      gap: 12px;
    }
    #startMsg h2 {
      color: #fff;
      font-weight: 900;
      text-shadow: 2px 2px 0 #000;
      font-size: clamp(22px, 7vw, 36px);
    }
    #startMsg p {
      color: #ffd200;
      font-weight: bold;
      text-shadow: 1px 1px 0 #000;
      font-size: clamp(14px, 4.5vw, 22px);
      animation: pulso 0.9s infinite alternate;
    }
    /* Ícono de toque para celular */
    #startMsg .tap-hint {
      font-size: clamp(36px, 12vw, 64px);
      animation: pulso 0.9s infinite alternate;
    }

    @keyframes pulso {
      from { opacity: 0.5; transform: scale(1); }
      to   { opacity: 1;   transform: scale(1.07); }
    }

    /* ── Botón de toque grande (toda la pantalla de juego) ── */
    #tapZone {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 5;          /* encima del canvas, debajo de overlays */
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <!-- Zona de toque transparente que cubre todo el juego -->
  <div id="tapZone"></div>

  <!-- Pantalla de inicio -->
  <div id="startMsg">
    <h2>🐦 Pájaro Volador</h2>
    <div class="tap-hint">👆</div>
    <p>Toca la pantalla para jugar</p>
  </div>

  <!-- Pantalla Game Over -->
  <div id="overlay">
    <h1>¡Perdiste!</h1>
    <div class="puntos" id="puntosFinal">Puntuación: 0</div>
    <button id="btnReiniciar">🔄 Reiniciar</button>
  </div>
</div>

<script>
// ── CONFIGURACIÓN BASE (para canvas 480×640) ──────────────────────────────────
const CFG = {
  gravity:      0.5,
  flapSpeed:   -8,
  terminalVel:  10,
  pipeSpeed:    3,
  pipeWidth:    60,
  pipeGap:      150,
  pipeInterval: 1500,
  birdX:        100,
  birdW:        50,
  birdH:        40,
};

// Dimensiones lógicas fijas del juego
const GAME_W = 480;
const GAME_H = 640;

// ── DOM ───────────────────────────────────────────────────────────────────────
const canvas       = document.getElementById('gameCanvas');
const ctx          = canvas.getContext('2d');
const overlay      = document.getElementById('overlay');
const puntosFinal  = document.getElementById('puntosFinal');
const btnReiniciar = document.getElementById('btnReiniciar');
const startMsg     = document.getElementById('startMsg');
const tapZone      = document.getElementById('tapZone');
const container    = document.getElementById('gameContainer');

// Dimensiones lógicas del canvas (siempre 480×640)
canvas.width  = GAME_W;
canvas.height = GAME_H;

// ── ESCALAR AL TAMAÑO DE PANTALLA ─────────────────────────────────────────────
function resizeGame() {
  const screenW = window.innerWidth;
  const screenH = window.innerHeight;

  // Escala manteniendo proporción 480:640 (3:4)
  const scale = Math.min(screenW / GAME_W, screenH / GAME_H);

  const displayW = Math.floor(GAME_W * scale);
  const displayH = Math.floor(GAME_H * scale);

  // Aplica tamaño visual al canvas (CSS) sin cambiar la resolución lógica
  canvas.style.width  = displayW + 'px';
  canvas.style.height = displayH + 'px';

  // Ajusta el contenedor
  container.style.width  = displayW + 'px';
  container.style.height = displayH + 'px';
}

resizeGame();
window.addEventListener('resize', resizeGame);
window.addEventListener('orientationchange', () => {
  setTimeout(resizeGame, 200); // pequeño delay para que el navegador actualice dimensiones
});

// ── IMÁGENES ──────────────────────────────────────────────────────────────────
const imgBird = new Image();
const imgPipe = new Image();
let birdOk = false;
let pipeOk = false;
let loaded = 0;

function onLoad() {
  loaded++;
  if (loaded >= 2) drawStartFrame();
}

imgBird.onload  = () => { birdOk = true;  onLoad(); };
imgBird.onerror = () => { birdOk = false; onLoad(); };
imgPipe.onload  = () => { pipeOk = true;  onLoad(); };
imgPipe.onerror = () => { pipeOk = false; onLoad(); };

imgBird.src = 'pajaro.png';
imgPipe.src = 'tuvo verde.png';

// ── ESTADO ────────────────────────────────────────────────────────────────────
let state = 'start';
let animId = null;
let bird  = {};
let pipes = [];
let score = 0;
let lastPipeTime = 0;
let clouds = [];

function initClouds() {
  clouds = [];
  for (let i = 0; i < 5; i++) {
    clouds.push({
      x:     Math.random() * GAME_W,
      y:     30 + Math.random() * 200,
      w:     90 + Math.random() * 80,
      h:     28 + Math.random() * 24,
      speed: 0.3 + Math.random() * 0.5,
    });
  }
}

function resetGame() {
  bird = { x: CFG.birdX, y: GAME_H / 2, vy: 0, w: CFG.birdW, h: CFG.birdH };
  pipes = [];
  score = 0;
  lastPipeTime = 0;
  initClouds();
}

// ── DIBUJO ────────────────────────────────────────────────────────────────────
function drawBg() {
  const sky = ctx.createLinearGradient(0, 0, 0, GAME_H * 0.75);
  sky.addColorStop(0, '#4fc3f7');
  sky.addColorStop(1, '#b3e5fc');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, GAME_W, GAME_H * 0.75);

  const ground = ctx.createLinearGradient(0, GAME_H * 0.75, 0, GAME_H);
  ground.addColorStop(0,   '#66bb6a');
  ground.addColorStop(0.3, '#43a047');
  ground.addColorStop(1,   '#2e7d32');
  ctx.fillStyle = ground;
  ctx.fillRect(0, GAME_H * 0.75, GAME_W, GAME_H * 0.25);

  ctx.fillStyle = '#81c784';
  ctx.fillRect(0, GAME_H * 0.75, GAME_W, 12);

  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  for (const c of clouds) drawCloud(c.x, c.y, c.w, c.h);
}

function drawCloud(x, y, w, h) {
  ctx.beginPath();
  ctx.ellipse(x,          y,          w * 0.38, h * 0.5,  0, 0, Math.PI * 2);
  ctx.ellipse(x + w*0.28, y - h*0.22, w * 0.28, h * 0.45, 0, 0, Math.PI * 2);
  ctx.ellipse(x + w*0.52, y,          w * 0.32, h * 0.5,  0, 0, Math.PI * 2);
  ctx.fill();
}

function drawBird() {
  ctx.save();
  const angle = Math.min(Math.max(bird.vy * 0.055, -0.45), 0.65);
  ctx.translate(bird.x + bird.w / 2, bird.y + bird.h / 2);
  ctx.rotate(angle);
  if (birdOk) {
    ctx.drawImage(imgBird, -bird.w / 2, -bird.h / 2, bird.w, bird.h);
  } else {
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.ellipse(0, 0, bird.w / 2, bird.h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FF8C00';
    ctx.beginPath();
    ctx.ellipse(bird.w * 0.22, 0, bird.w * 0.14, bird.h * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawPipes() {
  for (const p of pipes) {
    const topH = p.gapY - CFG.pipeGap / 2;
    const botY = p.gapY + CFG.pipeGap / 2;
    const botH = GAME_H - botY;

    if (pipeOk) {
      ctx.drawImage(imgPipe, p.x, botY, CFG.pipeWidth, botH);
      ctx.save();
      ctx.translate(p.x + CFG.pipeWidth / 2, topH / 2);
      ctx.scale(1, -1);
      ctx.drawImage(imgPipe, -CFG.pipeWidth / 2, -topH / 2, CFG.pipeWidth, topH);
      ctx.restore();
    } else {
      ctx.fillStyle = '#33691e';
      ctx.fillRect(p.x, 0, CFG.pipeWidth, topH);
      ctx.fillStyle = '#558b2f';
      ctx.fillRect(p.x + 4, 0, CFG.pipeWidth - 8, topH - 4);
      ctx.fillStyle = '#33691e';
      ctx.fillRect(p.x - 5, topH - 22, CFG.pipeWidth + 10, 22);
      ctx.fillStyle = '#558b2f';
      ctx.fillRect(p.x - 3, topH - 20, CFG.pipeWidth + 6, 18);

      ctx.fillStyle = '#33691e';
      ctx.fillRect(p.x, botY, CFG.pipeWidth, botH);
      ctx.fillStyle = '#558b2f';
      ctx.fillRect(p.x + 4, botY + 4, CFG.pipeWidth - 8, botH);
      ctx.fillStyle = '#33691e';
      ctx.fillRect(p.x - 5, botY, CFG.pipeWidth + 10, 22);
      ctx.fillStyle = '#558b2f';
      ctx.fillRect(p.x - 3, botY + 2, CFG.pipeWidth + 6, 18);
    }
  }
}

function drawScore() {
  ctx.save();
  ctx.font = 'bold 28px Arial';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#000';
  ctx.fillStyle   = '#fff';
  ctx.strokeText('Puntos: ' + score, 10, 36);
  ctx.fillText  ('Puntos: ' + score, 10, 36);
  ctx.restore();
}

function drawStartFrame() {
  drawBg();
  if (birdOk) {
    ctx.drawImage(imgBird, GAME_W / 2 - CFG.birdW / 2, GAME_H / 2 - CFG.birdH / 2, CFG.birdW, CFG.birdH);
  }
}

// ── LÓGICA ────────────────────────────────────────────────────────────────────
function spawnPipe(now) {
  const minGapY = 100 + CFG.pipeGap / 2;
  const maxGapY = GAME_H - 100 - CFG.pipeGap / 2;
  const gapY = minGapY + Math.random() * (maxGapY - minGapY);
  pipes.push({ x: GAME_W, gapY, scored: false });
  lastPipeTime = now;
}

function updateClouds() {
  for (const c of clouds) {
    c.x -= c.speed;
    if (c.x + c.w < 0) {
      c.x = GAME_W + c.w;
      c.y = 30 + Math.random() * 200;
    }
  }
}

function checkCollision() {
  if (bird.y <= 0 || bird.y + bird.h >= GAME_H) return true;
  const bL = bird.x + 4, bR = bird.x + bird.w - 4;
  const bT = bird.y + 4, bB = bird.y + bird.h - 4;
  for (const p of pipes) {
    const pL = p.x, pR = p.x + CFG.pipeWidth;
    const topH = p.gapY - CFG.pipeGap / 2;
    const botY = p.gapY + CFG.pipeGap / 2;
    if (bR > pL && bL < pR) {
      if (bT < topH || bB > botY) return true;
    }
  }
  return false;
}

function updateScore() {
  for (const p of pipes) {
    if (!p.scored && bird.x > p.x + CFG.pipeWidth) {
      p.scored = true;
      score++;
    }
  }
}

// ── GAME LOOP ─────────────────────────────────────────────────────────────────
function gameLoop(now) {
  if (state !== 'playing') return;
  bird.vy = Math.min(bird.vy + CFG.gravity, CFG.terminalVel);
  bird.y += bird.vy;
  updateClouds();
  if (now - lastPipeTime > CFG.pipeInterval) spawnPipe(now);
  pipes = pipes.filter(p => p.x + CFG.pipeWidth > 0);
  for (const p of pipes) p.x -= CFG.pipeSpeed;
  updateScore();
  if (checkCollision()) { gameOver(); return; }
  drawBg();
  drawPipes();
  drawBird();
  drawScore();
  animId = requestAnimationFrame(gameLoop);
}

function gameOver() {
  state = 'gameover';
  cancelAnimationFrame(animId);
  drawBg(); drawPipes(); drawBird(); drawScore();
  puntosFinal.textContent = 'Puntuación: ' + score;
  overlay.classList.add('visible');
}

function startGame() {
  if (animId) cancelAnimationFrame(animId);
  overlay.classList.remove('visible');
  startMsg.style.display = 'none';
  resetGame();
  state = 'playing';
  spawnPipe(performance.now());
  animId = requestAnimationFrame(gameLoop);
}

// ── ACCIÓN DE VOLAR (flap) ────────────────────────────────────────────────────
function doFlap() {
  if (state === 'start')        startGame();
  else if (state === 'playing') bird.vy = CFG.flapSpeed;
  // gameover → ignorar (el botón Reiniciar lo maneja)
}

// ── CONTROLES: TECLADO ────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.keyCode === 32) {
    e.preventDefault();
    doFlap();
  }
});

// ── CONTROLES: TOQUE / CLIC ───────────────────────────────────────────────────
// tapZone cubre todo el canvas y captura toques durante el juego
tapZone.addEventListener('touchstart', (e) => {
  e.preventDefault();   // evita el scroll y el zoom al tocar
  doFlap();
}, { passive: false });

tapZone.addEventListener('click', doFlap);

// El botón Reiniciar también funciona con toque
btnReiniciar.addEventListener('touchstart', (e) => {
  e.preventDefault();
  startGame();
}, { passive: false });

btnReiniciar.addEventListener('click', startGame);
</script>
</body>
</html>
